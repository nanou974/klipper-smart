  <text x="208" y="434" font-size="12" text-anchor="end" fill="#1d2330">V (5 V)</text>
  <text x="208" y="464" font-size="12" text-anchor="end" fill="#1d2330">G (GND)</text>
  <line x1="220" y1="430" x2="330" y2="430" stroke="#e03131" stroke-width="3"/>
  <circle cx="220" cy="430" r="4" fill="#e03131"/><circle cx="330" cy="430" r="4" fill="#e03131"/>
  <text x="342" y="434" font-size="12" fill="#ffffff">5V</text>
  <line x1="220" y1="460" x2="330" y2="460" stroke="#212529" stroke-width="3"/>
  <circle cx="220" cy="460" r="4" fill="#212529"/><circle cx="330" cy="460" r="4" fill="#212529"/>
  <text x="342" y="464" font-size="12" fill="#ffffff">GND</text>
  <text x="480" y="548" font-size="12" text-anchor="middle" fill="#5b6475">Schéma de principe, non à l'échelle. Une couleur par signal. Le 5 V et la masse de l'écran viennent des broches 5V et GND de l'ESP32-S3.</text>
