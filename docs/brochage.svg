<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- Breakout USB-C : alimentation -->
  <rect x="40" y="100" width="200" height="100" rx="10" fill="#f4f5f7" stroke="#5b6475" stroke-width="1.5"/>
  <text x="140" y="90" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d2330">Breakout USB-C</text>
  <text x="130" y="140" font-size="12" text-anchor="middle" fill="#5b6475">alimentation 5 V</text>
  <text x="226" y="114" font-size="12" text-anchor="end" fill="#1d2330">VBUS (5 V)</text>
  <text x="226" y="154" font-size="12" text-anchor="end" fill="#1d2330">GND</text>
  <circle cx="240" cy="114" r="4" fill="#c0392b"/>
  <circle cx="240" cy="154" r="4" fill="#1d2330"/>

  <!-- Alimentation vers l'ESP32-S3 -->
  <line x1="240" y1="114" x2="330" y2="114" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="240" y1="154" x2="330" y2="154" stroke="#1d2330" stroke-width="2.5"/>

  <!-- ESP32-S3 -->
  <rect x="330" y="40" width="220" height="400" rx="10" fill="#0e1014"/>
  <text x="440" y="68" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">ESP32-S3</text>
  <text x="440" y="86" font-size="11" text-anchor="middle" fill="#aab0bb">broches utilisées</text>
  <text x="344" y="118" font-size="12" fill="#ffffff">5V</text>
  <text x="344" y="158" font-size="12" fill="#ffffff">GND</text>
  <text x="538" y="118" font-size="12" text-anchor="end" fill="#ffffff">GPIO12 · SCK</text>
  <text x="538" y="158" font-size="12" text-anchor="end" fill="#ffffff">GPIO11 · MOSI</text>
  <text x="538" y="198" font-size="12" text-anchor="end" fill="#ffffff">GPIO15 · CS</text>
  <text x="538" y="238" font-size="12" text-anchor="end" fill="#ffffff">GPIO9 · DC (RS)</text>
  <text x="538" y="278" font-size="12" text-anchor="end" fill="#ffffff">GPIO10 · SDA</text>
  <text x="538" y="318" font-size="12" text-anchor="end" fill="#ffffff">GPIO14 · SCL</text>
  <text x="538" y="358" font-size="12" text-anchor="end" fill="#aab0bb">GPIO13 · MISO</text>
  <circle cx="330" cy="118" r="3" fill="#ffffff"/>
  <circle cx="330" cy="158" r="3" fill="#ffffff"/>
  <circle cx="550" cy="118" r="3" fill="#ffffff"/>
  <circle cx="550" cy="158" r="3" fill="#ffffff"/>
  <circle cx="550" cy="198" r="3" fill="#ffffff"/>
  <circle cx="550" cy="238" r="3" fill="#ffffff"/>
  <circle cx="550" cy="278" r="3" fill="#ffffff"/>
  <circle cx="550" cy="318" r="3" fill="#ffffff"/>
  <circle cx="550" cy="358" r="3" fill="#aab0bb"/>

  <!-- Liaisons ESP32-S3 vers l'écran -->
  <line x1="550" y1="118" x2="700" y2="118" stroke="#2f6fd6" stroke-width="2.5"/>
  <line x1="550" y1="158" x2="700" y2="158" stroke="#2f6fd6" stroke-width="2.5"/>
  <line x1="550" y1="198" x2="700" y2="198" stroke="#2f6fd6" stroke-width="2.5"/>
  <line x1="550" y1="238" x2="700" y2="238" stroke="#2f6fd6" stroke-width="2.5"/>
  <line x1="550" y1="278" x2="700" y2="278" stroke="#1a9e8f" stroke-width="2.5"/>
  <line x1="550" y1="318" x2="700" y2="318" stroke="#1a9e8f" stroke-width="2.5"/>
  <line x1="550" y1="358" x2="700" y2="358" stroke="#aab0bb" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="625" y="112" font-size="11" text-anchor="middle" fill="#5b6475">SPI</text>
  <text x="625" y="272" font-size="11" text-anchor="middle" fill="#5b6475">I2C tactile</text>
  <text x="625" y="352" font-size="11" text-anchor="middle" fill="#5b6475">non relié</text>

  <!-- Écran TFT35 SPI -->
  <rect x="700" y="40" width="220" height="400" rx="10" fill="#f4f5f7" stroke="#5b6475" stroke-width="1.5"/>
  <text x="810" y="68" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d2330">Écran TFT35 SPI</text>
  <text x="810" y="86" font-size="11" text-anchor="middle" fill="#5b6475">ILI9488 · 320 × 480</text>
  <text x="716" y="122" font-size="12" fill="#1d2330">SCK</text>
  <text x="716" y="162" font-size="12" fill="#1d2330">MOSI</text>
  <text x="716" y="202" font-size="12" fill="#1d2330">CS</text>
  <text x="716" y="242" font-size="12" fill="#1d2330">DC (RS)</text>
  <text x="716" y="282" font-size="12" fill="#1d2330">SDA (tactile)</text>
  <text x="716" y="322" font-size="12" fill="#1d2330">SCL (tactile)</text>
  <text x="716" y="362" font-size="12" fill="#5b6475">MISO (libre)</text>
  <circle cx="700" cy="118" r="3" fill="#1d2330"/>
  <circle cx="700" cy="158" r="3" fill="#1d2330"/>
  <circle cx="700" cy="198" r="3" fill="#1d2330"/>
  <circle cx="700" cy="238" r="3" fill="#1d2330"/>
  <circle cx="700" cy="278" r="3" fill="#1d2330"/>
  <circle cx="700" cy="318" r="3" fill="#1d2330"/>
  <circle cx="700" cy="358" r="3" fill="#aab0bb"/>

  <text x="480" y="466" font-size="12" text-anchor="middle" fill="#5b6475">Schéma de principe, non à l'échelle. Le 5 V et la masse de l'écran se relient aux broches 5V et GND de l'ESP32-S3.</text>
</svg>
